# Apache VirtualHost Configuration for Nextcloud
# Author: Sai Charan
#
# Description:
# This configuration file sets up an Apache VirtualHost for Nextcloud, a popular self-hosted cloud storage solution. It includes necessary directives for security, performance, and functionality.
#
# Note: 
# In production, HTTPS should be enabled using a separate SSL virtual host configuration. This file focuses on HTTP.

<VirtualHost *:80>
    ServerName home-server (replace with your actual domain or IP)
    DocumentRoot /var/www/nextcloud

    <Directory /var/www/nextcloud>
        Require all granted
        AllowOverride All
        Options FollowSymLinks MultiViews
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/nextcloud_error.log
    CustomLog ${APACHE_LOG_DIR}/nextcloud_access.log combined
</VirtualHost>
